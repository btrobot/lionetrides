# 完整 Spec 示例 — 询盘模块

```yaml
module: inquiry

entity:
  name: Inquiry
  table: inquiries
  fields:
    id:
      type: integer
      primary_key: true
      auto_increment: true
    user_id:
      type: integer
      required: false
      relation: users.id
    product_id:
      type: integer
      required: false
      relation: products.id
    company_name:
      type: string
      required: true
      max_length: 255
    contact_name:
      type: string
      required: true
      max_length: 255
    contact_email:
      type: string
      required: true
      max_length: 255
    contact_phone:
      type: string
      required: false
      max_length: 50
    quantity:
      type: integer
      required: false
    message:
      type: string
      required: false
      max_length: 5000
    status:
      type: enum
      values: [pending, processing, completed, cancelled]
      default: pending
    created_at:
      type: datetime
      default: now
    updated_at:
      type: datetime
      default: now
      on_update: true
    deleted_at:
      type: datetime
      required: false

operations:
  list:
    method: GET
    path: /api/v1/inquiries
    auth: auth
    pagination: true
    params:
      page: { type: integer, default: 1 }
      pageSize: { type: integer, default: 20, max: 100 }
      status: { type: enum, values: [pending, processing, completed, cancelled], required: false }
    response:
      items: Inquiry[]
      total: integer
      page: integer
      pageSize: integer

  create:
    method: POST
    path: /api/v1/inquiries
    auth: auth
    body:
      product_id: { type: integer, required: false }
      company_name: { type: string, required: true }
      contact_name: { type: string, required: true }
      contact_email: { type: string, required: true }
      contact_phone: { type: string, required: false }
      quantity: { type: integer, required: false }
      message: { type: string, required: false }
    response: Inquiry

  updateStatus:
    method: PUT
    path: /api/v1/inquiries/:id/status
    auth: admin
    params:
      id: { type: integer, in: path }
    body:
      status: { type: enum, values: [pending, processing, completed, cancelled], required: true }
    response: Inquiry

state_machine:
  initial: pending
  states:
    - name: pending
      label: 待处理
    - name: processing
      label: 处理中
    - name: completed
      label: 已完成
    - name: cancelled
      label: 已取消
  transitions:
    - from: pending
      to: processing
      action: process
      auth: admin
    - from: pending
      to: cancelled
      action: cancel
      auth: [admin, owner]
    - from: processing
      to: completed
      action: complete
      auth: admin
    - from: processing
      to: cancelled
      action: cancel
      auth: admin
  rules:
    - description: 已完成或已取消的状态不可再转换
      constraint: terminal_states: [completed, cancelled]
    - description: 状态变更必须记录到 inquiry_history 表
      constraint: audit_required: true

rules:
  - id: I001
    severity: error
    description: 联系邮箱必须符合标准邮箱格式
    validation: email ~ /^[^\s@]+@[^\s@]+\.[^\s@]+$/
    error: Invalid email format
  - id: I002
    severity: error
    description: 公司名称不能为空
    validation: company_name.length > 0
    error: Company name is required
  - id: I003
    severity: warning
    description: 已完成的询盘应记录处理时间
    validation: completed_at is set when status=completed
    note: 建议在 completed 状态转换时记录时间戳
```