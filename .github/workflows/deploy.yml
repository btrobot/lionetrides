name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ github.repository }}
  APP_PORT: 5000
  CONTAINER_NAME: lionetrides-container
  REGISTRY: ghcr.io
  MIRROR_REGISTRY: ghcr.nju.edu.cn

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PROJECT_NAME=lionetrides
            PROJECT_VERSION=1.0.0

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            IMAGE_NAME="${{ env.IMAGE_NAME }}"
            CONTAINER_NAME="${{ env.CONTAINER_NAME }}"
            APP_PORT=${{ env.APP_PORT }}
            MIRROR_REGISTRY="${{ env.MIRROR_REGISTRY }}"
            ENV_FILE="/data/lionetrides/.env.local"
            NETWORK="auto-ingress_gateway-net"

            echo "=== Lionet Rides Deploy ==="
            echo "Image: ${MIRROR_REGISTRY}/${IMAGE_NAME}"

            # 登录 ghcr.io（推送用）
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 记录旧容器状态（用于回滚）
            OLD_IMAGE=""
            if docker ps -a --format '{{.Names}} {{.ID}}' | grep -q "^${CONTAINER_NAME} "; then
              OLD_IMAGE=$(docker inspect --format '{{.Image}}' "${CONTAINER_NAME}")
              echo "旧容器镜像 SHA: ${OLD_IMAGE}"
            fi

            # 拉取新镜像（南京大学镜像站）
            echo "拉取新镜像..."
            docker pull "${MIRROR_REGISTRY}/${IMAGE_NAME}:latest"

            # 停止旧容器
            if docker ps -a --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
              echo "停止旧容器..."
              docker stop "${CONTAINER_NAME}"
              docker rm "${CONTAINER_NAME}"
            fi

            # 启动新容器
            echo "启动新容器..."
            docker run -d \
              --name "${CONTAINER_NAME}" \
              --network "${NETWORK}" \
              --restart unless-stopped \
              -p "${APP_PORT}:5000" \
              -e "PORT=5000" \
              --env-file "${ENV_FILE}" \
              "${MIRROR_REGISTRY}/${IMAGE_NAME}:latest"

            # 初始化数据库（内联）
            echo "=== 初始化数据库 ==="
            PGUSER=$(grep '^PGUSER=' "${ENV_FILE}" | cut -d= -f2)
            PGPASSWORD=$(grep '^PGPASSWORD=' "${ENV_FILE}" | cut -d= -f2)
            PGDATABASE=$(grep '^PGDATABASE=' "${ENV_FILE}" | cut -d= -f2)
            
            if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='${PGUSER}'" | grep -q 1; then
              echo "创建数据库用户: ${PGUSER}"
              sudo -u postgres psql -c "CREATE USER ${PGUSER} WITH PASSWORD '${PGPASSWORD}';"
            fi
            
            if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='${PGDATABASE}'" | grep -q 1; then
              echo "创建数据库: ${PGDATABASE}"
              sudo -u postgres psql -c "CREATE DATABASE ${PGDATABASE} OWNER ${PGUSER};"
            fi
            echo "数据库就绪"

            # 执行数据库迁移
            echo "=== 执行数据库迁移 ==="
            if ! docker exec "${CONTAINER_NAME}" node /app/migrations/migrate.js; then
              echo "迁移失败，回滚..."
              if [ -n "${OLD_IMAGE}" ]; then
                docker stop "${CONTAINER_NAME}" 2>/dev/null
                docker rm "${CONTAINER_NAME}" 2>/dev/null
                docker run -d \
                  --name "${CONTAINER_NAME}" \
                  --network "${NETWORK}" \
                  -p "${APP_PORT}:${APP_PORT}" \
                  --restart unless-stopped \
                  --env-file "${ENV_FILE}" \
                  "${OLD_IMAGE}"
              fi
              exit 1
            fi

            # 健康检查（内联）
            echo "=== 健康检查 ==="
            HEALTH_OK=false
            for i in $(seq 1 30); do
              if curl -sf "http://localhost:${APP_PORT}/api/health" > /dev/null 2>&1; then
                HEALTH_OK=true
                echo "✓ 服务就绪 (${i}s)"
                break
              fi
              sleep 2
            done
            
            if [ "${HEALTH_OK}" != "true" ]; then
              echo "健康检查失败，回滚..."
              if [ -n "${OLD_IMAGE}" ]; then
                docker stop "${CONTAINER_NAME}" 2>/dev/null
                docker rm "${CONTAINER_NAME}" 2>/dev/null
                docker run -d \
                  --name "${CONTAINER_NAME}" \
                  --network "${NETWORK}" \
                  -p "${APP_PORT}:${APP_PORT}" \
                  --restart unless-stopped \
                  --env-file "${ENV_FILE}" \
                  "${OLD_IMAGE}"
              fi
              exit 1
            fi

            # 步骤 5: 执行种子数据（首次部署时，仅当数据库为空时执行）
            echo "=== 检查种子数据 ==="
            docker exec ${CONTAINER_NAME} node /app/migrations/seed.js 2>&1 || echo "⚠ 种子执行失败（非致命，可稍后手动执行）"

            # 清理旧镜像
            docker image prune -f

            echo "=== 部署成功 ==="
