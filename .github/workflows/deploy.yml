name: Deploy

on:
  workflow_dispatch:
    inputs:
      region:
        description: '镜像源环境 (global=国际, cn=国内)'
        required: true
        default: 'cn'
        type: choice
        options:
          - global
          - cn

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ github.repository }}
  APP_PORT: 5000
  CONTAINER_NAME: lionetrides-container

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set registry for deploy
        id: registry
        run: |
          if [ "${{ github.event.inputs.region }}" = "cn" ]; then
            echo "registry=ghcr.nju.edu.cn" >> $GITHUB_OUTPUT
          else
            echo "registry=ghcr.io" >> $GITHUB_OUTPUT
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.login_registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registry.outputs.registry }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PROJECT_NAME=lionetrides
            PROJECT_VERSION=1.0.0

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Set registry for deploy
        id: registry
        run: |
          if [ "${{ github.event.inputs.region }}" = "cn" ]; then
            echo "registry=ghcr.nju.edu.cn" >> $GITHUB_OUTPUT
          else
            echo "registry=ghcr.io" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            REGISTRY="${{ steps.registry.outputs.registry }}"
            IMAGE_NAME="${{ env.IMAGE_NAME }}"
            CONTAINER_NAME="${{ env.CONTAINER_NAME }}"
            APP_PORT=${{ env.APP_PORT }}

            echo "=== Lionet Rides Deploy ==="
            echo "Region: ${{ github.event.inputs.region }}"
            echo "Registry: ${REGISTRY}"
            echo "Image: ${REGISTRY}/${IMAGE_NAME}"

            # 登录镜像仓库（南京大学镜像无需认证，ghcr.io 需要）
            if [ "${REGISTRY}" != "ghcr.nju.edu.cn" ]; then
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            fi

            # 记录旧容器状态（用于回滚）
            OLD_CONTAINER_SHA=""
            if docker ps -a --format '{{.Names}} {{.ID}}' | grep -q "^${CONTAINER_NAME} "; then
              OLD_CONTAINER_SHA=$(docker inspect --format '{{.Image}}' "${CONTAINER_NAME}")
              echo "旧容器镜像 SHA: ${OLD_CONTAINER_SHA}"
            fi

            # 拉取新镜像
            echo "拉取新镜像..."
            docker pull "${REGISTRY}/${IMAGE_NAME}:latest"

            # 停止旧容器
            if docker ps -a --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
              echo "停止旧容器..."
              docker stop "${CONTAINER_NAME}"
              docker rm "${CONTAINER_NAME}"
            fi

            # 启动新容器
            echo "启动新容器..."
            docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              -p "${APP_PORT}:5000" \
              -e "PORT=5000" \
              --env-file /data/lionetrides/.env.local \
              "${REGISTRY}/${IMAGE_NAME}:latest"

            # 执行数据库迁移
            echo "执行数据库迁移..."
            if docker exec "${CONTAINER_NAME}" npx drizzle-kit migrate 2>&1; then
              echo "数据库迁移完成"
            else
              echo "数据库迁移失败，回滚..."
              docker stop "${CONTAINER_NAME}"
              docker rm "${CONTAINER_NAME}"
              if [ -n "${OLD_CONTAINER_SHA}" ]; then
                docker run -d --name "${CONTAINER_NAME}" --restart unless-stopped -p "${APP_PORT}:5000" --env-file /data/lionetrides/.env.local "${OLD_CONTAINER_SHA}"
                echo "已回滚到旧镜像"
              fi
              exit 1
            fi

            # 健康检查（120 秒）
            echo "等待服务就绪..."
            for i in $(seq 1 24); do
              if curl -sf "http://localhost:${APP_PORT}/en" > /dev/null 2>&1; then
                echo "健康检查通过 (${i}×5s)"
                break
              fi
              if [ $i -eq 24 ]; then
                echo "健康检查失败，回滚..."
                docker stop "${CONTAINER_NAME}"
                docker rm "${CONTAINER_NAME}"
                if [ -n "${OLD_CONTAINER_SHA}" ]; then
                  docker run -d --name "${CONTAINER_NAME}" --restart unless-stopped -p "${APP_PORT}:5000" --env-file /data/lionetrides/.env.local "${OLD_CONTAINER_SHA}"
                  echo "已回滚到旧镜像"
                fi
                exit 1
              fi
              echo "等待... (${i}/24)"
              sleep 5
            done

            # 清理旧镜像
            docker image prune -f

            echo "部署完成"
