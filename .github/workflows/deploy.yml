name: Deploy (Mode A — Server Build)

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            APP_DIR="/data/lionetrides"
            CONTAINER_NAME="lionetrides-container"
            IMAGE_NAME="lionetrides:latest"
            APP_PORT=5000

            echo "=== Lionet Rides Deploy (Mode A) ==="

            # 拉取最新代码
            cd "${APP_DIR}"
            git pull origin main

            # 记录旧镜像 SHA（用于回滚）
            OLD_IMAGE_SHA=""
            if docker image inspect "${IMAGE_NAME}" >/dev/null 2>&1; then
              OLD_IMAGE_SHA=$(docker image inspect --format '{{.Id}}' "${IMAGE_NAME}")
              echo "旧镜像 SHA: ${OLD_IMAGE_SHA}"
            fi

            # 构建新镜像
            echo "构建 Docker 镜像..."
            bash docker-build.sh --region cn

            # 停止旧容器
            if docker ps -a --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
              echo "停止旧容器..."
              docker stop "${CONTAINER_NAME}"
              docker rm "${CONTAINER_NAME}"
            fi

            # 启动新容器
            echo "启动新容器..."
            bash docker-run.sh --port ${APP_PORT}

            # 健康检查（120 秒）
            echo "等待服务就绪..."
            for i in $(seq 1 24); do
              if curl -sf "http://localhost:${APP_PORT}/en" > /dev/null 2>&1; then
                echo "健康检查通过 (${i}×5s)"
                break
              fi
              if [ $i -eq 24 ]; then
                echo "健康检查失败，回滚..."
                docker stop "${CONTAINER_NAME}"
                docker rm "${CONTAINER_NAME}"
                if [ -n "${OLD_IMAGE_SHA}" ]; then
                  docker run -d --name "${CONTAINER_NAME}" --restart unless-stopped -p "${APP_PORT}:5000" "${OLD_IMAGE_SHA}"
                  echo "已回滚到旧镜像"
                fi
                exit 1
              fi
              echo "等待... (${i}/24)"
              sleep 5
            done

            # 清理旧镜像
            if [ -n "${OLD_IMAGE_SHA}" ]; then
              docker image prune -f
            fi

            echo "部署完成"
