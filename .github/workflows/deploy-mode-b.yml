name: Deploy (Mode B — GHA Build + Push)

on:
  workflow_dispatch:
    inputs:
      region:
        description: '镜像源环境 (global=国际, cn=国内, auto=自动)'
        required: true
        default: 'global'
        type: choice
        options:
          - global
          - cn
          - auto

concurrency:
  group: deploy-mode-b
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_PORT: 5000
  CONTAINER_NAME: lionetrides-container

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PROJECT_NAME=lionetrides
            PROJECT_VERSION=1.0.0
            DEPLOY_REGION=${{ github.event.inputs.region }}

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            REGISTRY="${{ env.REGISTRY }}"
            IMAGE_NAME="${{ env.IMAGE_NAME }}"
            CONTAINER_NAME="${{ env.CONTAINER_NAME }}"
            APP_PORT=${{ env.APP_PORT }}
            IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"

            echo "=== Lionet Rides Deploy (Mode B) ==="
            echo "Image: ${REGISTRY}/${IMAGE_NAME}"

            # 登录 GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${REGISTRY} -u ${{ github.actor }} --password-stdin

            # 记录旧容器状态（用于回滚）
            OLD_CONTAINER_SHA=""
            if docker ps -a --format '{{.Names}} {{.ID}}' | grep -q "^${CONTAINER_NAME} "; then
              OLD_CONTAINER_SHA=$(docker inspect --format '{{.Image}}' "${CONTAINER_NAME}")
              echo "旧容器镜像 SHA: ${OLD_CONTAINER_SHA}"
            fi

            # 拉取新镜像
            echo "拉取新镜像..."
            docker pull "${REGISTRY}/${IMAGE_NAME}:latest"

            # 停止旧容器
            if docker ps -a --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
              echo "停止旧容器..."
              docker stop "${CONTAINER_NAME}"
              docker rm "${CONTAINER_NAME}"
            fi

            # 启动新容器
            echo "启动新容器..."
            docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              -p "${APP_PORT}:5000" \
              -e "PORT=5000" \
              -e "PGPORT=5433" \
              "${REGISTRY}/${IMAGE_NAME}:latest"

            # 健康检查（120 秒）
            echo "等待服务就绪..."
            for i in $(seq 1 24); do
              if curl -sf "http://localhost:${APP_PORT}/en" > /dev/null 2>&1; then
                echo "健康检查通过 (${i}×5s)"
                break
              fi
              if [ $i -eq 24 ]; then
                echo "健康检查失败，回滚..."
                docker stop "${CONTAINER_NAME}" 2>/dev/null || true
                docker rm "${CONTAINER_NAME}" 2>/dev/null || true
                if [ -n "${OLD_CONTAINER_SHA}" ]; then
                  docker run -d --name "${CONTAINER_NAME}" --restart unless-stopped -p "${APP_PORT}:5000" "${OLD_CONTAINER_SHA}"
                  echo "已回滚到旧镜像"
                fi
                exit 1
              fi
              echo "等待... (${i}/24)"
              sleep 5
            done

            # 清理旧镜像
            docker image prune -f

            echo "部署完成"
