---
name: "🚀 Mode B — Docker Build & Deploy (GitHub Actions)"

on:
  workflow_dispatch:
    inputs:
      region:
        description: '部署环境（镜像源）'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto       # 自动检测
          - global     # 官方源（GitHub Actions 默认）
          - cn         # 国内镜像源

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: "🐳 构建 & 推送镜像"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DEPLOY_REGION=${{ github.event.inputs.region }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            BUILD_VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: "🚀 部署到服务器"
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH 部署
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "=== 拉取最新镜像 ==="
            docker pull ghcr.io/${{ github.repository }}:latest

            echo "=== 停止旧容器 ==="
            docker stop lionetrides 2>/dev/null || true
            docker rm lionetrides 2>/dev/null || true

            echo "=== 启动新容器 ==="
            docker run -d \
              --name lionetrides \
              --restart unless-stopped \
              -p 3000:3000 \
              -v /data/lionetrides:/app/data \
              --env-file /data/lionetrides/.env.production \
              ghcr.io/${{ github.repository }}:latest

            echo "=== 清理旧镜像 ==="
            docker system prune -f

            echo "=== 验证部署 ==="
            sleep 3
            curl -s -o /dev/null -w "HTTP %{http_code}\n" http://localhost:3000 || echo "⚠️ 服务暂未就绪，请稍后检查"
