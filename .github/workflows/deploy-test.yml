name: Deploy Test (Skip Build)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像标签 (默认 latest)'
        required: false
        default: 'latest'
        type: string

concurrency:
  group: deploy-test
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ github.repository }}
  APP_PORT: 5000
  CONTAINER_NAME: lionetrides-container
  REGISTRY: ghcr.io
  MIRROR_REGISTRY: ghcr.nju.edu.cn

jobs:
  deploy-test:
    name: Deploy to Server (Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_NAME,CONTAINER_NAME,APP_PORT,MIRROR_REGISTRY,REGISTRY
          script: |
            set -euo pipefail

            echo "=== Deploy Test (Skip Build) ==="
            echo "Image: ${MIRROR_REGISTRY}/${IMAGE_NAME}:${{ inputs.image_tag }}"
            echo ""

            # 记录旧容器镜像 SHA（回滚用）
            OLD_IMAGE_SHA=""
            if docker ps --filter "name=${CONTAINER_NAME}" --format "{{.ID}}" | grep -q .; then
              OLD_IMAGE_SHA=$(docker inspect --format='{{.Image}}' ${CONTAINER_NAME} 2>/dev/null || echo "")
              echo "旧容器镜像 SHA: ${OLD_IMAGE_SHA}"
            fi

            # 拉取新镜像
            echo "拉取新镜像..."
            docker pull ${MIRROR_REGISTRY}/${IMAGE_NAME}:${{ inputs.image_tag }} || \
            docker pull ${REGISTRY}/${IMAGE_NAME}:${{ inputs.image_tag }}

            # 停止并删除旧容器
            echo "停止旧容器..."
            if docker ps --filter "name=${CONTAINER_NAME}" --format "{{.ID}}" | grep -q .; then
              docker stop ${CONTAINER_NAME}
              docker rm ${CONTAINER_NAME}
            fi

            # 启动新容器
            echo "启动新容器..."
            docker run -d \
              --name ${CONTAINER_NAME} \
              -p ${APP_PORT}:${APP_PORT} \
              --restart unless-stopped \
              --env-file /data/lionetrides/.env.local \
              ${MIRROR_REGISTRY}/${IMAGE_NAME}:${{ inputs.image_tag }} || \
            docker run -d \
              --name ${CONTAINER_NAME} \
              -p ${APP_PORT}:${APP_PORT} \
              --restart unless-stopped \
              --env-file /data/lionetrides/.env.local \
              ${REGISTRY}/${IMAGE_NAME}:${{ inputs.image_tag }}

            # 健康检查
            echo "健康检查..."
            MAX_WAIT=120
            INTERVAL=5
            elapsed=0

            while [ $elapsed -lt $MAX_WAIT ]; do
              if curl -sf http://localhost:${APP_PORT}/api/health > /dev/null 2>&1; then
                echo ""
                echo "✓ 健康检查通过 (${elapsed}s)"
                break
              fi
              echo -n "."
              sleep $INTERVAL
              elapsed=$((elapsed + INTERVAL))
            done

            if [ $elapsed -ge $MAX_WAIT ]; then
              echo ""
              echo "✗ 健康检查失败 (${MAX_WAIT}s 超时)"
              echo "回滚到旧版本..."
              docker stop ${CONTAINER_NAME} 2>/dev/null || true
              docker rm ${CONTAINER_NAME} 2>/dev/null || true
              if [ -n "${OLD_IMAGE_SHA}" ]; then
                docker run -d \
                  --name ${CONTAINER_NAME} \
                  -p ${APP_PORT}:${APP_PORT} \
                  --restart unless-stopped \
                  --env-file /data/lionetrides/.env.local \
                  ${OLD_IMAGE_SHA}
                echo "✓ 已回滚"
              fi
              exit 1
            fi

            # 数据库迁移（仅当迁移文件存在时）
            echo "检查数据库迁移..."
            if docker exec ${CONTAINER_NAME} sh -c '[ -d /app/drizzle && "$(ls -A /app/drizzle/*.sql 2>/dev/null)" ]'; then
              echo "执行数据库迁移..."
              docker exec ${CONTAINER_NAME} npx drizzle-kit migrate || echo "迁移失败（非致命）"
            else
              echo "无迁移文件，跳过数据库迁移"
            fi

            # 清理旧镜像
            echo "清理旧镜像..."
            docker image prune -f

            echo ""
            echo "=== 部署测试完成 ==="
