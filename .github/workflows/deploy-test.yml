name: Deploy Test (Skip Build)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像标签 (默认 latest)'
        required: false
        default: 'latest'
        type: string

concurrency:
  group: deploy-test
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ github.repository }}
  APP_PORT: 5000
  CONTAINER_NAME: lionetrides-container
  REGISTRY: ghcr.io
  MIRROR_REGISTRY: ghcr.nju.edu.cn

jobs:
  deploy-test:
    name: Deploy to Server (Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            IMAGE_NAME="${{ env.IMAGE_NAME }}"
            CONTAINER_NAME="${{ env.CONTAINER_NAME }}"
            APP_PORT=${{ env.APP_PORT }}
            MIRROR_REGISTRY="${{ env.MIRROR_REGISTRY }}"
            REGISTRY="${{ env.REGISTRY }}"
            IMAGE_TAG="${{ inputs.image_tag }}"
            ENV_FILE="/data/lionetrides/.env.local"
            NETWORK="auto-ingress_gateway-net"

            echo "=== Deploy Test (Skip Build) ==="
            echo "Image: ${MIRROR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
            echo ""

            # 记录旧容器镜像 SHA（回滚用）
            OLD_IMAGE=""
            if docker ps --filter "name=${CONTAINER_NAME}" --format "{{.ID}}" | grep -q .; then
              OLD_IMAGE=$(docker inspect --format='{{.Image}}' "${CONTAINER_NAME}" 2>/dev/null || echo "")
              echo "旧容器镜像 SHA: ${OLD_IMAGE}"
            fi

            # 拉取新镜像
            echo "拉取新镜像..."
            docker pull "${MIRROR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" || \
            docker pull "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

            # 停止并删除旧容器
            echo "停止旧容器..."
            if docker ps --filter "name=${CONTAINER_NAME}" --format "{{.ID}}" | grep -q .; then
              docker stop "${CONTAINER_NAME}"
              docker rm "${CONTAINER_NAME}"
            fi

            # 启动新容器
            echo "启动新容器..."
            docker run -d \
              --name "${CONTAINER_NAME}" \
              --network "${NETWORK}" \
              -p "${APP_PORT}:${APP_PORT}" \
              --restart unless-stopped \
              --env-file "${ENV_FILE}" \
              "${MIRROR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" || \
            docker run -d \
              --name "${CONTAINER_NAME}" \
              --network "${NETWORK}" \
              -p "${APP_PORT}:${APP_PORT}" \
              --restart unless-stopped \
              --env-file "${ENV_FILE}" \
              "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

            # 初始化数据库
            export ENV_FILE
            bash scripts/ci/init-database.sh

            # 执行数据库迁移
            export CONTAINER_NAME
            bash scripts/ci/run-migrations.sh || echo "迁移失败（非致命）"

            # 健康检查
            export APP_PORT
            if ! bash scripts/ci/health-check.sh; then
              echo "健康检查失败，回滚..."
              if [ -n "${OLD_IMAGE}" ]; then
                export OLD_IMAGE APP_PORT ENV_FILE NETWORK
                bash scripts/ci/rollback.sh
              fi
              exit 1
            fi

            # 清理旧镜像
            echo "清理旧镜像..."
            # 执行种子数据（首次部署时）
            echo "=== 检查种子数据 ==="
            docker exec ${CONTAINER_NAME} node /app/migrations/seed.js 2>&1 || echo "⚠ 种子执行失败（非致命，可稍后手动执行）"

            docker image prune -f

            echo "=== 部署测试成功 ==="
