# ============================================
# LionetRides 部署配置
# ============================================
# 这是一个高层 DSL，描述"我要什么"，而不是"怎么做"
# 生成器会自动生成 Dockerfile 和相关脚本

app:
  name: lionetrides
  type: web          # web | api | worker | static
  
  # 应用需要的服务
  needs:
    - postgresql     # 自动配置数据库
  
  # 如何构建
  build:
    from: ./src
    command: pnpm run build
    output: ./dist
  
  # 如何运行
  run:
    command: node dist/server.js
    port: 5000
  
  # 部署配置
  deploy:
    target: docker           # docker | k8s | serverless
    replicas: 1              # 副本数
    strategy: rolling        # rolling | blue-green | recreate
    regions: [cn, global]    # 部署区域

# 环境适配（可选，有默认值）
environments:
  china:
    npm_mirror: https://mirrors.cloud.tencent.com/npm
    apt_mirror: https://mirrors.ustc.edu.cn/debian
  global:
    npm_mirror: https://registry.npmjs.org
    apt_mirror: http://deb.debian.org/debian

# 安全配置（可选）
security:
  non_root: true             # 非 root 运行
  read_only_fs: false        # 只读文件系统

# 性能优化（可选）
optimization:
  multi_stage: true          # 多阶段构建
  tar_large_dirs:            # 大目录使用 tar
    - node_modules
  layer_caching: true        # 层缓存优化
  cleanup_caches: true       # 清理缓存
